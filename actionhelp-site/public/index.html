<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />

    <title>ActionHelp – Empowering Haitian and African Immigrants</title>
    <meta
      name="description"
      content="ActionHelp supports Haitian and African immigrants through education, advocacy, and community programs."
    />

    <!-- Favicon (uses your logo, replaces React logo) -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/images/logo.png" />

    <!-- Open Graph / Social Preview -->
    <meta property="og:title" content="ActionHelp – Empowering Communities" />
    <meta
      property="og:description"
      content="Join ActionHelp to empower Haitian and African immigrants through education, advocacy, and support."
    />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    <meta property="og:url" content="https://www.actionhelps.org/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ActionHelp – Empowering Communities" />
    <meta
      name="twitter:description"
      content="Helping immigrants thrive through education, support, and community action."
    />

    <!-- iOS / PWA -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
